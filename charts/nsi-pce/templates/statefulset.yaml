{{- include "nsi-pce.validateTls" . }}
{{- $mode := .Values.config.tls.client.mode }}
{{- $pem := .Values.config.tls.client.pem }}
{{- $keystore := .Values.config.tls.client.keystore }}
{{- $tlsPath := printf "%s-tls" .Values.config.mountPath }}
{{- $curlTls := ternary (printf "--cert %s/tls.crt --key %s/tls.key --cacert %s/ca.crt " $tlsPath $tlsPath $tlsPath) "" (eq $mode "pem") }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nsi-pce.fullname" . }}
  labels:
    {{- include "nsi-pce.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Chart.Name }}
  selector:
    matchLabels:
      {{- include "nsi-pce.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "nsi-pce.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nsi-pce.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-dds
          image: curlimages/curl:latest
          command: ["sh", "-c",
            {{ printf "until [ $(curl -sw '%%{http_code}' %s%s -o /dev/null) -eq 200 ]; do echo `date` sleeping 2 seconds ...; sleep 2; done" $curlTls .Values.config.ddsPortalUrl | quote }}
          ]
          {{- if eq $mode "pem" }}
          volumeMounts:
            - name: tls
              mountPath: {{ $tlsPath }}
              readOnly: true
          {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["java"]
          {{- if eq $mode "keystore" }}
          env:
            - name: KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $keystore.passwordSecretName }}
                  key: {{ $keystore.keyStorePasswordKey }}
            - name: TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $keystore.passwordSecretName }}
                  key: {{ $keystore.trustStorePasswordKey }}
          {{- end }}
          args:
            - {{ printf "-Xmx%s" .Values.maxHeapSize | quote }}
            - "-Djava.net.preferIPv4Stack=true"
            - "-Dorg.glassfish.jaxb.runtime.v2.runtime.JAXBContextImpl.fastBoot=true"
            {{- if eq $mode "pem" }}
            - "-Dnsi.tls.certificate={{ $tlsPath }}/tls.crt"
            - "-Dnsi.tls.privateKey={{ $tlsPath }}/tls.key"
            - "-Dnsi.tls.trustedCertificates={{ $tlsPath }}/ca.crt"
            {{- end }}
            {{- if eq $mode "keystore" }}
            {{- /* The JVM detects JKS or PKCS12; Kubernetes expands $(VAR) from env above. */}}
            - "-Djavax.net.ssl.keyStore={{ $tlsPath }}/keystore"
            - "-Djavax.net.ssl.keyStorePassword=$(KEYSTORE_PASSWORD)"
            - "-Djavax.net.ssl.trustStore={{ $tlsPath }}/truststore"
            - "-Djavax.net.ssl.trustStorePassword=$(TRUSTSTORE_PASSWORD)"
            {{- end }}
            - {{ printf "-Djava.util.logging.config.file=%s/logging.properties" .Values.config.mountPath | quote }}
            - {{ printf "-Dapp.home=%s" .Values.image.home | quote }}
            - {{ printf "-Dbasedir=%s" .Values.image.home | quote }}
            - "-jar"
            - {{ printf "%s/pce.jar" .Values.image.home | quote }}
            - {{ printf "-topologyConfigFile=%s/topology-dds.xml" .Values.config.mountPath | quote }}
          volumeMounts:
            - name: config
              mountPath: {{ .Values.config.mountPath }}
              readOnly: true
          {{- if $mode }}
            - name: tls
              mountPath: {{ $tlsPath }}
              readOnly: true
          {{- end }}
          ports:
            - name: internal
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              scheme: {{ .Values.livenessProbe.scheme }}
              path: {{ .Values.livenessProbe.path }}
              port: {{ .Values.service.containerPort }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              scheme: {{ .Values.startupProbe.scheme }}
              path: {{ .Values.startupProbe.path }}
              port: {{ .Values.service.containerPort }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        {{- if eq $mode "pem" }}
        - name: tls
          projected:
            defaultMode: 0440
            sources:
            - secret:
                name: {{ $pem.identitySecretName }}
                items:
                - key: tls.crt
                  path: tls.crt
                - key: tls.key
                  path: tls.key
            - secret:
                name: {{ $pem.caSecretName }}
                items:
                - key: {{ $pem.caKey }}
                  path: ca.crt
        {{- end }}
        {{- if eq $mode "keystore" }}
        - name: tls
          secret:
            secretName: {{ $keystore.secretName }}
            defaultMode: 0440
            items:
            - key: {{ $keystore.keyStoreKey }}
              path: keystore
            - key: {{ $keystore.trustStoreKey }}
              path: truststore
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
