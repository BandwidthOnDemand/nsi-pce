#!upstart

description "nsi-pce"

env USER=safnari
env GROUP=safnari
env HOME=/home/safnari/nsi-pce
env PORT="8400"
env ADDRESS="127.0.0.1"
env TLS_CERT=/home/safnari/tls/client.crt
env TLS_KEY=/home/safnari/tls/client.key
env TLS_CA=/home/safnari/tls/ca.crt

start on started nsi-dds
stop on stopping nsi-dds

respawn limit 10 5

script
[ -e /home/safnari/nsi-pce/pce.jar ]
exec su -l -s /bin/bash -c 'exec "$0" "$@"' $USER -- /usr/bin/java \
        -Xmx1536m -Djava.net.preferIPv4Stack=true  \
        -Dorg.glassfish.jaxb.runtime.v2.runtime.JAXBContextImpl.fastBoot=true \
        -Dnsi.tls.certificate=$TLS_CERT \
        -Dnsi.tls.privateKey=$TLS_KEY \
        -Dnsi.tls.trustedCertificates=$TLS_CA \
        -Dapp.home="$HOME" \
        -Dbasedir="/" \
        -Djava.util.logging.config.file="$HOME/config/logging.properties" \
        -jar "$HOME/pce.jar" \
        -c "$HOME/config/" \
        -topologyConfigFile "$HOME/config/topology-dds.xml" \
end script

